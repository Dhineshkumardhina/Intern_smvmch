name: internpulse
description: "InternPulse - Real-time internship monitoring system for Sri Manakula Vinayagar Engineering College"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Centralized Supabase Backend & Auth (Phase 1)
  supabase_flutter: ^2.8.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^14.0.1
  
  # Data Types & Equality
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # UI & Design Tokens
  google_fonts: ^6.2.1
  intl: ^0.19.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
